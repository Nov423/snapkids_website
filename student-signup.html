<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Sign Up</title>
    <style>
      :root {
        --foam: #dff8ff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: "Trebuchet MS", "Segoe UI", sans-serif;
        background: #0f6f9c;
      }

      .corner-logo {
        position: fixed;
        top: -36px;
        left: 1rem;
        width: min(34vw, 240px);
        height: auto;
      }

      .card {
        width: min(92vw, 520px);
        padding: 1.2rem;
        border-radius: 18px;
        background: rgba(7, 42, 71, 0.35);
        backdrop-filter: blur(2px);
        box-shadow:
          0 18px 40px rgba(0, 24, 44, 0.45),
          inset 0 0 0 1px rgba(223, 248, 255, 0.2);
      }

      h1 {
        margin: 0 0 1rem;
        color: #ffffff;
      }

      form {
        display: grid;
        gap: 0.75rem;
      }

      label {
        color: #ffffff;
        font-weight: 700;
      }

      input {
        width: 100%;
        border: 0;
        border-radius: 10px;
        padding: 0.75rem;
        font-size: 1rem;
      }

      .actions {
        margin-top: 0.5rem;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0.7rem;
      }

      .actions button,
      .actions a {
        border: 0;
        border-radius: 10px;
        padding: 0.8rem;
        font-size: 1rem;
        font-weight: 700;
        color: #06273f;
        background: linear-gradient(180deg, #ffffff, var(--foam));
        text-decoration: none;
        text-align: center;
        cursor: pointer;
      }

      .status {
        margin: 0;
        color: #dff8ff;
        font-size: 0.9rem;
        min-height: 1.2rem;
      }
    </style>
  </head>
  <body>
    <img class="corner-logo" src="snapkids_logo.png" alt="SNAPkids logo" />
    <main class="card">
      <h1>Student Sign Up</h1>
      <form id="student-signup-form">
        <label for="full-name">Full Name</label>
        <input id="full-name" name="full-name" type="text" required />

        <label for="email">Email</label>
        <input id="email" name="email" type="email" required />

        <label for="phone">Phone</label>
        <input id="phone" name="phone" type="tel" required />

        <label for="password">Password</label>
        <input id="password" name="password" type="password" required />

        <p class="status" id="status"></p>

        <div class="actions">
          <button type="submit">Create Account</button>
          <a href="index.html">Back</a>
        </div>
      </form>
    </main>
    <script>
      const form = document.getElementById("student-signup-form");
      const status = document.getElementById("status");
      const storageKey = "snapkids_student_signups_v1";

      form.addEventListener("submit", function (event) {
        event.preventDefault();
        const payload = {
          name: document.getElementById("full-name").value.trim(),
          email: document.getElementById("email").value.trim(),
          phone: document.getElementById("phone").value.trim(),
          password: document.getElementById("password").value,
          createdAt: new Date().toISOString(),
        };

        try {
          const existing = JSON.parse(localStorage.getItem(storageKey) || "[]");
          existing.push(payload);
          localStorage.setItem(storageKey, JSON.stringify(existing));
          status.textContent = "Account created. You can now sign in from the home page.";
          form.reset();
        } catch (error) {
          status.textContent = "Unable to save account. Please try again.";
        }
      });
    </script>
  </body>
</html>
