<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Administrator Login</title>
    <style>
      :root {
        --foam: #dff8ff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: "Trebuchet MS", "Segoe UI", sans-serif;
        background: #0f6f9c;
      }

      .corner-logo {
        position: fixed;
        top: -36px;
        left: 1rem;
        width: min(34vw, 240px);
        height: auto;
      }

      .card {
        width: min(90vw, 460px);
        padding: 2rem;
        border-radius: 20px;
        background: rgba(7, 42, 71, 0.35);
        backdrop-filter: blur(2px);
        box-shadow:
          0 18px 40px rgba(0, 24, 44, 0.45),
          inset 0 0 0 1px rgba(223, 248, 255, 0.2);
      }

      h1 {
        margin: 0 0 1.25rem;
        font-size: 1.5rem;
        color: white;
      }

      form {
        display: grid;
        gap: 0.9rem;
      }

      label {
        color: white;
        font-weight: 700;
      }

      input {
        width: 100%;
        border: 2px solid transparent;
        padding: 0.8rem 0.9rem;
        border-radius: 10px;
        font-size: 1rem;
      }

      .password-field {
        position: relative;
      }

      .password-field input {
        padding-right: 2.8rem;
      }

      .toggle-password {
        position: absolute;
        top: 50%;
        right: 0.55rem;
        transform: translateY(-50%);
        border: 0;
        padding: 0.2rem;
        width: auto;
        background: transparent;
        cursor: pointer;
        color: #4c5f70;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }

      .toggle-password svg {
        width: 18px;
        height: 18px;
        stroke: currentColor;
      }

      .toggle-password .eye {
        display: none;
      }

      .toggle-password .eye-off {
        display: block;
      }

      .toggle-password.visible .eye {
        display: block;
      }

      .toggle-password.visible .eye-off {
        display: none;
      }

      input.input-error {
        border-color: #ff4d4d;
      }

      .error-message {
        margin: -0.35rem 0 0;
        color: #ff6b6b;
        font-size: 0.85rem;
        font-weight: 700;
        display: none;
      }

      .error-message.visible {
        display: block;
      }

      .actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0.75rem;
        margin-top: 0.4rem;
      }

      .actions button,
      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        border: 0;
        padding: 0.9rem 1rem;
        border-radius: 12px;
        color: #06273f;
        font-size: 1rem;
        font-weight: 700;
        text-decoration: none;
        background: linear-gradient(180deg, #ffffff, var(--foam));
        cursor: pointer;
      }

      @media (max-width: 860px) {
        .corner-logo {
          width: min(42vw, 180px);
        }
      }
    </style>
  </head>
  <body>
    <img class="corner-logo" src="snapkids_logo.png" alt="SNAPkids logo" />
    <main class="card">
      <h1>Administrator Sign In</h1>
      <form id="admin-login-form">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" required />

        <label for="password">Password</label>
        <div class="password-field">
          <input id="password" name="password" type="password" required />
          <button class="toggle-password" id="toggle-password" type="button" aria-label="Show password">
            <svg
              class="eye"
              viewBox="0 0 24 24"
              fill="none"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z" />
              <circle cx="12" cy="12" r="3" />
            </svg>
            <svg
              class="eye-off"
              viewBox="0 0 24 24"
              fill="none"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M17.94 17.94A10.94 10.94 0 0 1 12 19C5 19 1 12 1 12a21.72 21.72 0 0 1 5.06-6.94" />
              <path d="M9.9 4.24A10.77 10.77 0 0 1 12 5c7 0 11 7 11 7a21.79 21.79 0 0 1-2.16 3.19" />
              <path d="M1 1l22 22" />
            </svg>
          </button>
        </div>
        <p id="login-error" class="error-message">Username and/or password incorrect</p>

        <div class="actions">
          <button type="submit">Sign In</button>
          <a href="index.html">Back</a>
        </div>
      </form>
    </main>
    <script>
      const form = document.getElementById("admin-login-form");
      const usernameInput = document.getElementById("username");
      const passwordInput = document.getElementById("password");
      const errorMessage = document.getElementById("login-error");
      const togglePasswordButton = document.getElementById("toggle-password");

      function clearErrorState() {
        usernameInput.classList.remove("input-error");
        passwordInput.classList.remove("input-error");
        errorMessage.classList.remove("visible");
      }

      usernameInput.addEventListener("input", clearErrorState);
      passwordInput.addEventListener("input", clearErrorState);
      togglePasswordButton.addEventListener("click", function () {
        const isVisible = passwordInput.type === "text";
        passwordInput.type = isVisible ? "password" : "text";
        togglePasswordButton.classList.toggle("visible", !isVisible);
        togglePasswordButton.setAttribute("aria-label", isVisible ? "Show password" : "Hide password");
      });

      form.addEventListener("submit", function (event) {
        event.preventDefault();

        const username = usernameInput.value;
        const password = passwordInput.value;

        if (username === "admin" && password === "123456") {
          window.location.href = "success.html";
        } else {
          usernameInput.classList.add("input-error");
          passwordInput.classList.add("input-error");
          errorMessage.classList.add("visible");
        }
      });
    </script>
  </body>
</html>
