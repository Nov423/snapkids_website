<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Calendar</title>
    <script>
      (function () {
        const studentAuthed = sessionStorage.getItem("snapkids_student_authenticated") === "true";
        if (!studentAuthed) {
          window.location.replace("student-login.html");
        }
      })();
    </script>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Trebuchet MS", "Segoe UI", sans-serif;
        background: #0f6f9c;
        color: #ffffff;
      }

      .top-bar {
        height: 110px;
        padding: 0.7rem 1rem;
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: rgba(7, 42, 71, 0.55);
        box-shadow: 0 8px 24px rgba(0, 24, 44, 0.35);
      }

      .top-logo {
        width: min(34vw, 240px);
        height: auto;
        transform: translateY(-20px);
      }

      .back-link {
        border: 0;
        border-radius: 10px;
        padding: 0.6rem 0.85rem;
        font-size: 0.95rem;
        font-weight: 700;
        text-decoration: none;
        color: #06273f;
        background: #dff8ff;
      }

      .page {
        padding: 1rem;
      }

      .card {
        width: min(960px, 100%);
        border-radius: 18px;
        padding: 1rem;
        background: rgba(7, 42, 71, 0.35);
        box-shadow:
          0 18px 40px rgba(0, 24, 44, 0.35),
          inset 0 0 0 1px rgba(223, 248, 255, 0.2);
      }

      .toolbar {
        display: flex;
        gap: 0.6rem;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 1rem;
        flex-wrap: wrap;
      }

      .title {
        margin: 0;
        font-size: 1.25rem;
      }

      .week-range {
        margin: 0.25rem 0 0;
        color: #dff8ff;
      }

      .nav {
        display: inline-flex;
        gap: 0.5rem;
      }

      .nav button {
        border: 0;
        border-radius: 10px;
        padding: 0.55rem 0.8rem;
        font-size: 0.95rem;
        font-weight: 700;
        color: #06273f;
        background: #dff8ff;
        cursor: pointer;
      }

      .week-grid {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        grid-template-columns: repeat(7, minmax(120px, 1fr));
        gap: 0.65rem;
      }

      .day {
        border-radius: 12px;
        padding: 0.75rem;
        background: rgba(223, 248, 255, 0.12);
        min-height: 150px;
      }

      .day-name {
        margin: 0;
        font-size: 0.95rem;
      }

      .day-date {
        margin: 0.2rem 0 0.55rem;
        color: #dff8ff;
        font-size: 0.88rem;
      }

      .class-item {
        margin: 0.45rem 0 0;
        padding: 0.35rem 0.45rem;
        border-radius: 8px;
        background: rgba(5, 33, 54, 0.45);
        font-size: 0.85rem;
        line-height: 1.3;
      }

      .class-item.none {
        opacity: 0.8;
      }

      @media (max-width: 980px) {
        .week-grid {
          grid-template-columns: repeat(2, minmax(140px, 1fr));
        }
      }
    </style>
  </head>
  <body>
    <header class="top-bar">
      <img class="top-logo" src="snapkids_logo.png" alt="SNAPkids logo" />
      <a class="back-link" href="student-home.html">Back</a>
    </header>
    <main class="page">
      <section class="card">
        <div class="toolbar">
          <div>
            <h1 class="title">Weekly Calendar</h1>
            <p class="week-range" id="week-range"></p>
          </div>
          <div class="nav">
            <button id="prev-week" type="button">Previous Week</button>
            <button id="next-week" type="button">Next Week</button>
          </div>
        </div>
        <ul class="week-grid" id="week-grid"></ul>
      </section>
    </main>
    <script>
      const weekRange = document.getElementById("week-range");
      const weekGrid = document.getElementById("week-grid");
      const dayNames = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"];
      const studentName = sessionStorage.getItem("snapkids_student_name") || "Student";
      let weekOffset = 0;

      function getMonday(date) {
        const copy = new Date(date);
        const day = copy.getDay();
        const diff = day === 0 ? -6 : 1 - day;
        copy.setDate(copy.getDate() + diff);
        copy.setHours(0, 0, 0, 0);
        return copy;
      }

      function addDays(date, days) {
        const copy = new Date(date);
        copy.setDate(copy.getDate() + days);
        return copy;
      }

      function formatShortDate(date) {
        return date.toLocaleDateString(undefined, { month: "short", day: "numeric" });
      }

      function hashName(value) {
        let hash = 0;
        for (let i = 0; i < value.length; i += 1) {
          hash = (hash * 31 + value.charCodeAt(i)) >>> 0;
        }
        return hash;
      }

      function scheduleForDay(dayIndex) {
        const hash = hashName(studentName);
        const sessionA = ["Kick + Breathing", "Freestyle Drills", "Water Safety", "Backstroke Form"];
        const sessionB = ["Technique Review", "Float Practice", "Wall Push-Offs", "Endurance Laps"];
        const hasClass = ((hash + weekOffset * 3 + dayIndex) % 3) !== 0;

        if (!hasClass) {
          return ["No class scheduled"];
        }

        const time = dayIndex % 2 === 0 ? "4:00 PM - 4:45 PM" : "5:15 PM - 6:00 PM";
        const first = sessionA[(hash + dayIndex + weekOffset) % sessionA.length];
        const second = sessionB[(hash + dayIndex + weekOffset) % sessionB.length];
        return [time, first, second];
      }

      function renderWeek() {
        const monday = addDays(getMonday(new Date()), weekOffset * 7);
        const sunday = addDays(monday, 6);
        weekRange.textContent = formatShortDate(monday) + " - " + formatShortDate(sunday);
        weekGrid.innerHTML = "";

        for (let i = 0; i < 7; i += 1) {
          const dayDate = addDays(monday, i);
          const sessions = scheduleForDay(i);
          const item = document.createElement("li");
          item.className = "day";
          item.innerHTML =
            '<h2 class="day-name">' +
            dayNames[i] +
            "</h2>" +
            '<p class="day-date">' +
            formatShortDate(dayDate) +
            "</p>";

          sessions.forEach(function (entry, entryIndex) {
            const row = document.createElement("p");
            row.className = "class-item" + (sessions.length === 1 ? " none" : "");
            row.textContent = entryIndex === 0 && sessions.length > 1 ? "Time: " + entry : entry;
            item.appendChild(row);
          });

          weekGrid.appendChild(item);
        }
      }

      document.getElementById("prev-week").addEventListener("click", function () {
        weekOffset -= 1;
        renderWeek();
      });

      document.getElementById("next-week").addEventListener("click", function () {
        weekOffset += 1;
        renderWeek();
      });

      renderWeek();
    </script>
  </body>
</html>
