<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Class Calendar</title>
    <script>
      (function () {
        if (sessionStorage.getItem("snapkids_admin_authenticated") !== "true") {
          window.location.replace("admin-login.html");
        }
      })();
    </script>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Trebuchet MS", "Segoe UI", sans-serif;
        background: #0f6f9c;
        color: #ffffff;
      }

      .top-bar {
        height: 110px;
        padding: 0.7rem 1rem;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: flex-start;
        background: rgba(7, 42, 71, 0.55);
        box-shadow: 0 8px 24px rgba(0, 24, 44, 0.35);
      }

      .top-logo {
        width: min(34vw, 240px);
        height: auto;
        transform: translateY(-20px);
      }

      .profile-btn {
        position: absolute;
        right: 1rem;
        border: 0;
        width: 44px;
        height: 44px;
        border-radius: 999px;
        background: rgba(223, 248, 255, 0.95);
        color: #06273f;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
      }

      .profile-menu {
        position: absolute;
        top: calc(100% - 8px);
        right: 1rem;
        min-width: 160px;
        border-radius: 12px;
        padding: 0.55rem;
        background: rgba(7, 42, 71, 0.97);
        box-shadow: 0 12px 28px rgba(0, 0, 0, 0.35);
        display: none;
        z-index: 5;
      }

      .profile-menu.open {
        display: block;
      }

      .logout-link {
        display: block;
        width: 100%;
        border: 0;
        border-radius: 8px;
        padding: 0.45rem 0.6rem;
        text-decoration: none;
        font-size: 0.86rem;
        font-weight: 700;
        color: #06273f;
        background: #dff8ff;
        text-align: center;
      }

      .logout-link + .logout-link {
        margin-top: 0.45rem;
      }

      .profile-btn svg {
        width: 22px;
        height: 22px;
        stroke: currentColor;
      }

      .page {
        min-height: calc(100vh - 110px);
        height: auto;
        padding: 1rem;
        display: flex;
        align-items: flex-start;
        gap: 1rem;
      }

      .sidebar {
        width: min(28vw, 320px);
        height: calc(100vh - 142px);
        border-radius: 18px;
        padding: 1rem;
        display: flex;
        flex-direction: column;
        gap: 0.7rem;
        background: rgba(7, 42, 71, 0.35);
        box-shadow:
          0 18px 40px rgba(0, 24, 44, 0.35),
          inset 0 0 0 1px rgba(223, 248, 255, 0.2);
      }

      .sidebar-btn {
        flex: 0 0 calc((100% - 2.1rem) / 4);
        width: 100%;
        border: 0;
        position: relative;
        border-radius: 12px;
        padding: 0.72rem 0.8rem;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        font-size: clamp(1.08rem, 1.6vw, 1.45rem);
        font-weight: 700;
        white-space: nowrap;
        color: #06273f;
        background: #dff8ff;
        cursor: pointer;
        transition: transform 120ms ease, background 120ms ease;
      }

      .sidebar-btn.active {
        background: rgba(7, 42, 71, 0.92);
        color: #ffffff;
        box-shadow: inset 0 0 0 1px rgba(223, 248, 255, 0.2);
        transform: translateX(10px);
        border-top-right-radius: 0;
        border-bottom-right-radius: 0;
      }

      .content-pane {
        flex: 1;
        display: flex;
        justify-content: stretch;
      }

      .calendar-shell {
        min-height: calc(100vh - 142px);
        width: 100%;
        height: auto;
        border-radius: 18px;
        padding: 1rem;
        display: flex;
        flex-direction: column;
        overflow: visible;
        background: rgba(7, 42, 71, 0.35);
        box-shadow:
          0 18px 40px rgba(0, 24, 44, 0.35),
          inset 0 0 0 1px rgba(223, 248, 255, 0.2);
      }

      .calendar-shell.blank-mode {
        justify-content: center;
      }

      .blank-panel {
        display: none;
        width: 100%;
        height: 100%;
        border-radius: 14px;
        background: rgba(223, 248, 255, 0.08);
        padding: 1rem;
      }

      .blank-panel.empty {
        background: rgba(223, 248, 255, 0.08);
      }

      .inbox {
        height: 100%;
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }

      .inbox-title {
        margin: 0;
        font-size: 1.25rem;
      }

      .directory-toolbar {
        display: grid;
        grid-template-columns: 1fr;
        gap: 0.55rem;
      }

      .directory-search {
        width: 100%;
        border: 0;
        border-radius: 10px;
        padding: 0.55rem 0.65rem;
        font-size: 0.92rem;
      }

      .inbox-list {
        margin: 0;
        padding: 0;
        list-style: none;
        display: grid;
        gap: 0.6rem;
        overflow-y: auto;
      }

      .inbox-item {
        border-radius: 12px;
        background: rgba(223, 248, 255, 0.14);
        padding: 0.7rem;
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 0.6rem;
        align-items: center;
      }

      .request-name {
        font-size: 1rem;
        font-weight: 700;
      }

      .request-hours {
        font-size: 0.9rem;
        opacity: 0.95;
      }

      .request-actions {
        display: flex;
        gap: 0.45rem;
      }

      .request-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: 0;
        border-radius: 8px;
        padding: 0.5rem 0.7rem;
        font-size: 0.85rem;
        font-weight: 700;
        text-decoration: none;
        color: #06273f;
        background: #dff8ff;
        cursor: pointer;
        white-space: nowrap;
      }

      .calendar-shell.blank-mode .blank-panel {
        display: block;
      }

      .calendar-shell.blank-mode .calendar-controls,
      .calendar-shell.blank-mode .calendar-main {
        display: none;
      }

      .calendar-controls {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.8rem;
        margin-bottom: 1rem;
      }

      .calendar-main {
        flex: 1;
        min-height: 0;
        display: grid;
        grid-template-columns: 1.55fr 0.75fr;
        gap: 0.9rem;
      }

      .calendar-left {
        min-height: 0;
        display: flex;
        flex-direction: column;
      }

      .tasks-box {
        min-height: 0;
        border-radius: 12px;
        padding: 0.85rem;
        background: rgba(223, 248, 255, 0.14);
        display: flex;
        flex-direction: column;
        gap: 0.65rem;
      }

      .tasks-title {
        margin: 0;
        font-size: 1.05rem;
      }

      .tasks-list {
        margin: 0;
        padding: 0;
        list-style: none;
        display: grid;
        gap: 0.45rem;
        overflow-y: auto;
      }

      .tasks-list li {
        border-radius: 8px;
        padding: 0.48rem 0.55rem;
        background: rgba(7, 42, 71, 0.45);
        font-size: 0.9rem;
        cursor: pointer;
      }

      .month-nav {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.6rem;
        flex: 1;
      }

      .term-select {
        border: 0;
        border-radius: 10px;
        padding: 0.6rem 0.85rem;
        font-size: 1rem;
        font-weight: 700;
        color: #06273f;
        background: #dff8ff;
      }

      .month-title {
        margin: 0;
        font-size: clamp(1.15rem, 2.5vw, 1.7rem);
        min-width: 190px;
        text-align: center;
      }

      .month-nav-btn {
        border: 0;
        width: 36px;
        height: 36px;
        border-radius: 9px;
        font-size: 1.15rem;
        font-weight: 700;
        line-height: 1;
        color: #06273f;
        background: #dff8ff;
        cursor: pointer;
      }

      .today-btn {
        border: 0;
        border-radius: 9px;
        padding: 0.55rem 0.75rem;
        font-size: 0.9rem;
        font-weight: 700;
        color: #06273f;
        background: #dff8ff;
        cursor: pointer;
      }

      .controls-right {
        width: 120px;
        flex-shrink: 0;
        display: flex;
        justify-content: flex-end;
      }

      .calendar-weekdays,
      .calendar-days {
        display: grid;
        grid-template-columns: repeat(7, minmax(0, 1fr));
        gap: 0.55rem;
      }

      .calendar-weekdays {
        margin-bottom: 0.55rem;
      }

      .weekday {
        text-align: center;
        font-weight: 700;
        padding: 0.45rem 0.2rem;
        border-radius: 10px;
        background: rgba(223, 248, 255, 0.2);
      }

      .calendar-days {
        flex: 1;
        grid-auto-rows: minmax(88px, auto);
      }

      .day-cell {
        border-radius: 12px;
        padding: 0.6rem;
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
        gap: 0.5rem;
        background: rgba(223, 248, 255, 0.14);
        font-weight: 700;
        overflow: hidden;
      }

      .day-cell.clickable {
        cursor: pointer;
      }

      .day-number {
        line-height: 1;
      }

      .class-tag {
        border: 0;
        width: 100%;
        text-align: center;
        padding: 0.28rem 0.4rem;
        border-radius: 8px;
        font-size: 0.82rem;
        font-weight: 700;
        color: #06273f;
        background: #dff8ff;
        cursor: pointer;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: clip;
      }

      .user-event-tag {
        border: 0;
        width: 100%;
        border-radius: 7px;
        padding: 0.22rem 0.35rem;
        font-size: 0.74rem;
        font-weight: 700;
        line-height: 1.1;
        color: #ffffff;
        background: rgba(7, 42, 71, 0.78);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: clip;
        text-align: left;
        cursor: pointer;
      }

      .day-cell.empty {
        background: rgba(223, 248, 255, 0.05);
      }

      .modal-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.45);
        display: none;
        align-items: center;
        justify-content: center;
        padding: 1rem;
        z-index: 20;
      }

      .modal-backdrop.open {
        display: flex;
      }

      .event-modal {
        width: min(560px, 100%);
        border-radius: 14px;
        padding: 1rem;
        background: rgba(7, 42, 71, 0.98);
        box-shadow: 0 18px 40px rgba(0, 0, 0, 0.35);
      }

      .modal-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 0.9rem;
      }

      .modal-header-actions {
        display: flex;
        gap: 0.45rem;
      }

      .modal-title {
        margin: 0;
        font-size: 1.15rem;
      }

      .close-modal {
        border: 0;
        border-radius: 8px;
        width: 30px;
        height: 30px;
        font-size: 1rem;
        font-weight: 700;
        color: #06273f;
        background: #dff8ff;
        cursor: pointer;
      }

      .delete-event-btn {
        border: 0;
        border-radius: 8px;
        padding: 0.45rem 0.6rem;
        font-size: 0.82rem;
        font-weight: 700;
        color: #ffffff;
        background: #c93f3f;
        cursor: pointer;
      }

      .confirm-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.45);
        display: none;
        align-items: center;
        justify-content: center;
        padding: 1rem;
        z-index: 30;
      }

      .confirm-backdrop.open {
        display: flex;
      }

      .confirm-modal {
        width: min(420px, 100%);
        border-radius: 14px;
        padding: 1rem;
        background: rgba(7, 42, 71, 0.98);
        box-shadow: 0 18px 40px rgba(0, 0, 0, 0.35);
      }

      .confirm-title {
        margin: 0 0 0.5rem;
        font-size: 1.05rem;
      }

      .confirm-text {
        margin: 0 0 0.9rem;
        font-size: 0.92rem;
        opacity: 0.95;
      }

      .confirm-actions {
        display: flex;
        justify-content: flex-end;
        gap: 0.55rem;
      }

      .confirm-cancel,
      .confirm-delete {
        border: 0;
        border-radius: 8px;
        padding: 0.5rem 0.75rem;
        font-size: 0.88rem;
        font-weight: 700;
        cursor: pointer;
      }

      .confirm-cancel {
        color: #06273f;
        background: #dff8ff;
      }

      .confirm-delete {
        color: #ffffff;
        background: #c93f3f;
      }

      .event-form {
        display: grid;
        gap: 0.75rem;
      }

      .event-form label {
        font-size: 0.92rem;
        font-weight: 700;
      }

      .event-form input,
      .event-form textarea,
      .event-form select {
        width: 100%;
        border: 0;
        border-radius: 8px;
        padding: 0.55rem 0.6rem;
        font-size: 0.92rem;
      }

      .time-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0.6rem;
      }

      .time-group {
        display: grid;
        gap: 0.35rem;
      }

      .time-selects {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 0.4rem;
      }

      .add-event-btn {
        border: 0;
        border-radius: 10px;
        padding: 0.6rem 0.8rem;
        font-size: 0.95rem;
        font-weight: 700;
        color: #06273f;
        background: #dff8ff;
        cursor: pointer;
      }

      @media (max-width: 760px) {
        .top-bar {
          height: 92px;
          padding: 0.5rem 0.7rem;
        }

        .top-logo {
          width: min(42vw, 180px);
        }

        .page {
          min-height: calc(100vh - 92px);
          height: auto;
          padding: 0.7rem;
          flex-direction: column;
          gap: 0.7rem;
        }

        .sidebar {
          width: 100%;
          height: auto;
          flex-direction: row;
          flex-wrap: wrap;
        }

        .sidebar-btn {
          flex: 1 1 calc(50% - 0.7rem);
          text-align: center;
          border-radius: 12px;
        }

        .sidebar-btn.active {
          transform: none;
          border-radius: 12px;
        }

        .content-pane {
          justify-content: stretch;
        }

        .calendar-controls {
          flex-direction: column;
          align-items: flex-start;
        }

        .calendar-main {
          grid-template-columns: 1fr;
        }

        .month-nav {
          width: 100%;
        }

        .controls-right {
          width: 100%;
          justify-content: flex-end;
        }

        .calendar-days {
          grid-auto-rows: minmax(64px, auto);
        }

        .time-row {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <header class="top-bar">
      <img class="top-logo" src="snapkids_logo.png" alt="SNAPkids logo" />
      <button class="profile-btn" id="profile-btn" type="button" aria-label="Profile">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21a8 8 0 0 0-16 0" />
          <circle cx="12" cy="8" r="4" />
        </svg>
      </button>
      <div class="profile-menu" id="profile-menu">
        <a class="logout-link" href="profile-page.html">View Profile</a>
        <a class="logout-link" href="index.html" id="logout-link">Log out</a>
      </div>
    </header>
    <main class="page">
      <aside class="sidebar">
        <button class="sidebar-btn active" type="button" data-view="calendar">Calender</button>
        <button class="sidebar-btn" type="button" data-view="volunteers">Volunteers</button>
        <button class="sidebar-btn" type="button" data-view="students">Students</button>
        <button class="sidebar-btn" type="button" data-view="forms">Volunteer Forms</button>
      </aside>
      <div class="content-pane">
        <section class="calendar-shell" id="main-panel">
          <div class="calendar-controls">
            <select class="term-select" id="term-select" aria-label="Select season and year"></select>
            <div class="month-nav">
              <button class="month-nav-btn" id="prev-month" type="button" aria-label="Previous month">&lt;</button>
              <h1 class="month-title" id="month-title"></h1>
              <button class="month-nav-btn" id="next-month" type="button" aria-label="Next month">&gt;</button>
            </div>
            <div class="controls-right">
              <button class="today-btn" id="today-btn" type="button">Today</button>
            </div>
          </div>

          <div class="calendar-main">
            <div class="calendar-left">
              <div class="calendar-weekdays">
                <div class="weekday">Sun</div>
                <div class="weekday">Mon</div>
                <div class="weekday">Tue</div>
                <div class="weekday">Wed</div>
                <div class="weekday">Thu</div>
                <div class="weekday">Fri</div>
                <div class="weekday">Sat</div>
              </div>
              <div class="calendar-days" id="calendar-days"></div>
            </div>
            <aside class="tasks-box">
              <h2 class="tasks-title">Upcoming Tasks</h2>
              <ul class="tasks-list" id="upcoming-tasks-list"></ul>
            </aside>
          </div>
          <div class="blank-panel empty" id="blank-panel"></div>
        </section>
      </div>
    </main>
    <div class="modal-backdrop" id="event-modal-backdrop">
      <div class="event-modal" role="dialog" aria-modal="true" aria-labelledby="event-modal-title">
        <div class="modal-header">
          <h2 class="modal-title" id="event-modal-title">Add Event</h2>
          <button class="close-modal" id="close-event-modal" type="button" aria-label="Close">X</button>
        </div>
        <form class="event-form" id="event-form">
          <label for="event-name">Event Name</label>
          <input id="event-name" type="text" required />

          <div class="time-row">
            <div class="time-group">
              <label>Start Time</label>
              <div class="time-selects">
                <select id="start-hour"></select>
                <select id="start-minute"></select>
                <select id="start-meridiem">
                  <option>AM</option>
                  <option>PM</option>
                </select>
              </div>
            </div>
            <div class="time-group">
              <label>End Time</label>
              <div class="time-selects">
                <select id="end-hour"></select>
                <select id="end-minute"></select>
                <select id="end-meridiem">
                  <option>AM</option>
                  <option>PM</option>
                </select>
              </div>
            </div>
          </div>

          <label for="event-description">General Description</label>
          <textarea id="event-description" rows="4"></textarea>

          <button class="add-event-btn" type="submit">Add event</button>
        </form>
      </div>
    </div>
    <div class="modal-backdrop" id="event-info-backdrop">
      <div class="event-modal" role="dialog" aria-modal="true" aria-labelledby="event-info-title">
        <div class="modal-header">
          <h2 class="modal-title" id="event-info-title">Event Info</h2>
          <div class="modal-header-actions">
            <button class="delete-event-btn" id="delete-event-btn" type="button" style="display: none">
              Delete event
            </button>
            <button class="close-modal" id="close-event-info" type="button" aria-label="Close">X</button>
          </div>
        </div>
        <div class="event-form">
          <label>Event Name</label>
          <input id="info-name" type="text" readonly />
          <label>Date</label>
          <input id="info-date" type="text" readonly />
          <label>Start Time</label>
          <input id="info-start" type="text" readonly />
          <label>End Time</label>
          <input id="info-end" type="text" readonly />
          <label>Description</label>
          <textarea id="info-description" rows="4" readonly></textarea>
        </div>
      </div>
    </div>
    <div class="confirm-backdrop" id="delete-confirm-backdrop">
      <div class="confirm-modal" role="dialog" aria-modal="true" aria-labelledby="delete-confirm-title">
        <h3 class="confirm-title" id="delete-confirm-title">Delete event?</h3>
        <p class="confirm-text">This will remove the event from both the calendar and upcoming tasks.</p>
        <div class="confirm-actions">
          <button class="confirm-cancel" id="cancel-delete-event" type="button">Cancel</button>
          <button class="confirm-delete" id="confirm-delete-event" type="button">Delete event</button>
        </div>
      </div>
    </div>

    <script>
      const now = new Date();
      let currentYear = now.getFullYear();
      let currentMonth = now.getMonth();
      const monthTitle = document.getElementById("month-title");
      const calendarDays = document.getElementById("calendar-days");
      const upcomingTasksList = document.getElementById("upcoming-tasks-list");
      const eventModalBackdrop = document.getElementById("event-modal-backdrop");
      const eventInfoBackdrop = document.getElementById("event-info-backdrop");
      const deleteConfirmBackdrop = document.getElementById("delete-confirm-backdrop");
      const closeEventModalButton = document.getElementById("close-event-modal");
      const closeEventInfoButton = document.getElementById("close-event-info");
      const deleteEventButton = document.getElementById("delete-event-btn");
      const cancelDeleteEventButton = document.getElementById("cancel-delete-event");
      const confirmDeleteEventButton = document.getElementById("confirm-delete-event");
      const eventForm = document.getElementById("event-form");
      const eventNameInput = document.getElementById("event-name");
      const eventModalTitle = document.getElementById("event-modal-title");
      const startHourSelect = document.getElementById("start-hour");
      const startMinuteSelect = document.getElementById("start-minute");
      const startMeridiemSelect = document.getElementById("start-meridiem");
      const endHourSelect = document.getElementById("end-hour");
      const endMinuteSelect = document.getElementById("end-minute");
      const endMeridiemSelect = document.getElementById("end-meridiem");
      const eventDescriptionInput = document.getElementById("event-description");
      const infoNameInput = document.getElementById("info-name");
      const infoDateInput = document.getElementById("info-date");
      const infoStartInput = document.getElementById("info-start");
      const infoEndInput = document.getElementById("info-end");
      const infoDescriptionInput = document.getElementById("info-description");
      const prevMonthButton = document.getElementById("prev-month");
      const nextMonthButton = document.getElementById("next-month");
      const todayButton = document.getElementById("today-btn");
      const termSelect = document.getElementById("term-select");
      const mainPanel = document.getElementById("main-panel");
      const blankPanel = document.getElementById("blank-panel");
      const profileButton = document.getElementById("profile-btn");
      const profileMenu = document.getElementById("profile-menu");
      const logoutLink = document.getElementById("logout-link");
      const sidebarButtons = Array.from(document.querySelectorAll(".sidebar-btn"));
      const params = new URLSearchParams(window.location.search);
      const initialView = params.get("tab");

      function formatQuarterHours(hours) {
        const whole = Math.floor(hours);
        const fraction = Math.round((hours - whole) * 100) / 100;
        if (fraction === 0) {
          return whole + ".0";
        }
        if (fraction === 0.25) {
          return whole + ".25";
        }
        if (fraction === 0.5) {
          return whole + ".5";
        }
        if (fraction === 0.75) {
          return whole + ".75";
        }
        return String(hours);
      }

      function slugifyName(name) {
        return name.toLowerCase().replace(/\s+/g, "-");

      function escapeHtml(value) {
        return String(value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function splitName(fullName) {
        const parts = fullName.trim().split(/\s+/);
        if (parts.length <= 1) {
          return { first: fullName.trim(), last: fullName.trim() };
        }
        return {
          first: parts[0],
          last: parts.slice(1).join(" "),
        };
      }

      function formatLastFirstName(fullName) {
        const parsed = splitName(fullName);
        return parsed.last + ", " + parsed.first;
      }

      function compareNamesByLastFirst(nameA, nameB) {
        const a = splitName(nameA);
        const b = splitName(nameB);
        const lastCompare = a.last.localeCompare(b.last);
        if (lastCompare !== 0) {
          return lastCompare;
        }
        return a.first.localeCompare(b.first);
      }

        return (

          formatLastFirstName(fullName).toLowerCase().includes(normalized)

      function getSeasonForMonth(monthIndex) {
        if (monthIndex <= 2) {
          return "winter";
        }
        if (monthIndex <= 5) {
          return "spring";
        }
        if (monthIndex <= 8) {
          return "summer";
        }
        return "fall";
      }

      function getStartMonthForSeason(season) {
        if (season === "winter") {
          return 0;
        }
        if (season === "spring") {
          return 3;
        }
        if (season === "summer") {
          return 6;
        }
        return 9;
      }

      function capitalize(value) {
        return value.charAt(0).toUpperCase() + value.slice(1);
      }

      function formatLocalDate(date) {
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, "0");
        const day = String(date.getDate()).padStart(2, "0");
        return year + "-" + month + "-" + day;
      }

      function formatReadableDate(date) {
        return date.toLocaleDateString(undefined, {
          weekday: "long",
          month: "long",
          day: "numeric",
          year: "numeric",
        });
      }

      function formatDisplayTime(hourValue, minuteValue, meridiemValue) {

      function loadUserEvents() {
        try {
          const raw = localStorage.getItem(userEventsStorageKey);
          if (!raw) {
            return;
          }
          const parsed = JSON.parse(raw);
          Object.keys(parsed).forEach(function (dateKey) {
            const events = Array.isArray(parsed[dateKey]) ? parsed[dateKey] : [];
            const normalized = events.map(function (eventItem) {
              return {
                id: eventItem.id || String(Date.now()) + Math.random().toString(16).slice(2),
                name: eventItem.name || "Event",
                description: eventItem.description || "",
                startText: eventItem.startText || "",
                endText: eventItem.endText || "",
                startMinutes: typeof eventItem.startMinutes === "number" ? eventItem.startMinutes : 0,
              };
            });
            userEventsByDate.set(dateKey, normalized);
          });
        } catch (error) {
          // Ignore malformed saved data.
        }
      }

      function saveUserEvents() {
        const payload = {};
        userEventsByDate.forEach(function (events, dateKey) {
          payload[dateKey] = events;

        localStorage.setItem(userEventsStorageKey, JSON.stringify(payload));

      function to12HourMinutes(hourValue, minuteValue, meridiemValue) {
        let hour = Number(hourValue);
        const minute = Number(minuteValue);
        if (meridiemValue === "AM") {
          if (hour === 12) {
            hour = 0;
          }
        } else if (hour !== 12) {
          hour += 12;
        }
        return hour * 60 + minute;
      }

        }
      }

      function shiftSeason(season, year, offset) {
        const seasons = ["winter", "spring", "summer", "fall"];
        let index = seasons.indexOf(season);
        let shiftedYear = year;
        let remaining = offset;

        while (remaining !== 0) {
          if (remaining > 0) {
            index += 1;
            if (index > 3) {
              index = 0;
              shiftedYear += 1;
            }
            remaining -= 1;
          } else {
            index -= 1;
            if (index < 0) {
              index = 3;
              shiftedYear -= 1;
            }
            remaining += 1;
          }
        }

        return { season: seasons[index], year: shiftedYear };
      }

      function buildSeasonOptions() {
        termSelect.innerHTML = "";
        const baseSeason = getSeasonForMonth(now.getMonth());
        const baseYear = now.getFullYear();
        const earliest = shiftSeason(baseSeason, baseYear, -2);
        const latest = shiftSeason(baseSeason, baseYear, 3);

        minAllowedYear = earliest.year;
        minAllowedMonth = getStartMonthForSeason(earliest.season);
        maxAllowedYear = latest.year;
        maxAllowedMonth = getStartMonthForSeason(latest.season) + 2;

        for (let offset = -2; offset <= 3; offset += 1) {
          const item = shiftSeason(baseSeason, baseYear, offset);
          const value = item.season + "-" + item.year;
          const option = document.createElement("option");
          option.value = value;
          option.textContent = capitalize(item.season) + " " + item.year;
          termSelect.appendChild(option);
        }
      }

      function isBeforeMinBound(year, month) {
        if (year < minAllowedYear) {
          return true;
        }
        if (year === minAllowedYear && month < minAllowedMonth) {
          return true;
        }
        return false;
      }

      function isAfterMaxBound(year, month) {
        if (year > maxAllowedYear) {
          return true;
        }
        if (year === maxAllowedYear && month > maxAllowedMonth) {
          return true;
        }
        return false;
      }

      function syncSeasonFromMonth() {
        const season = getSeasonForMonth(currentMonth);
        const optionValue = season + "-" + currentYear;
        const matching = termSelect.querySelector('option[value="' + optionValue + '"]');
        if (matching) {
          termSelect.value = optionValue;
        }
      }

      function renderCalendar(year, month) {
        calendarDays.innerHTML = "";
        const displayDate = new Date(year, month, 1);

        monthTitle.textContent = displayDate.toLocaleDateString(undefined, {
          month: "long",
          year: "numeric",
        });

        const firstWeekday = new Date(year, month, 1).getDay();
        const daysInMonth = new Date(year, month + 1, 0).getDate();

        for (let i = 0; i < firstWeekday; i += 1) {
          const emptyCell = document.createElement("div");
          emptyCell.className = "day-cell empty";
          calendarDays.appendChild(emptyCell);
        }

        for (let day = 1; day <= daysInMonth; day += 1) {
          const date = new Date(year, month, day);
          const dateValue = formatLocalDate(date);
          const dayCell = document.createElement("div");
          dayCell.className = "day-cell clickable";
          const dayNumber = document.createElement("div");
          dayNumber.className = "day-number";
          dayNumber.textContent = String(day);
          dayCell.appendChild(dayNumber);

          dayCell.addEventListener("click", function () {
            openEventModal(date);
          });

          if (date.getDay() === 6) {
            const classTag = document.createElement("button");
            classTag.type = "button";
            classTag.className = "class-tag";
            classTag.textContent = "Class";
            classTag.addEventListener("click", function (event) {
              event.stopPropagation();
              window.location.href = buildClassDetailsUrl(dateValue);
            });
            dayCell.appendChild(classTag);
          }

          const addedEvents = userEventsByDate.get(dateValue) || [];
          addedEvents.forEach(function (eventItem) {
            const eventTag = document.createElement("button");
            eventTag.type = "button";
            eventTag.className = "user-event-tag";
            eventTag.textContent = eventItem.name;
            eventTag.addEventListener("click", function (event) {
              event.stopPropagation();
              openEventInfoModal({
                name: eventItem.name,
                readableDate: formatReadableDate(date),
                startText: eventItem.startText || "",
                endText: eventItem.endText || "",
                description: eventItem.description || "",
                deletable: true,
                dateKey: dateValue,
                eventId: eventItem.id,
              });
            });
            dayCell.appendChild(eventTag);
          });

          calendarDays.appendChild(dayCell);
        }

        renderUpcomingTasks();
        syncSeasonFromMonth();
      }

      function renderUpcomingTasks() {
        upcomingTasksList.innerHTML = "";
        const events = [];
        const startDate = new Date(now.getFullYear(), now.getMonth(), now.getDate());
        const cursor = new Date(startDate);
        const limitDate = new Date(maxAllowedYear, maxAllowedMonth + 1, 0);

        while (events.length < 40 && cursor <= limitDate) {
          const dateKey = formatLocalDate(cursor);
          if (cursor.getDay() === 6) {
            const classDateValue = formatLocalDate(cursor);
            events.push({
              date: new Date(cursor),
              dateValue: classDateValue,
              label: "Class",
              startMinutes: 0,
              startText: "9:00 AM",
              endText: "10:00 AM",
              description: "Weekly class session.",
              deletable: false,
            });
          }

          const extraEvents = userEventsByDate.get(dateKey) || [];
          extraEvents.forEach(function (eventItem) {
            events.push({
              date: new Date(cursor),
              dateValue: dateKey,
              label: eventItem.name,
              startMinutes: eventItem.startMinutes,
              startText: eventItem.startText || "",
              endText: eventItem.endText || "",
              description: eventItem.description || "",
              eventId: eventItem.id,
              deletable: true,
            });
          });

          events.sort(function (a, b) {
            const dateDiff = a.date.getTime() - b.date.getTime();
            if (dateDiff !== 0) {
              return dateDiff;
            }
            return a.startMinutes - b.startMinutes;
          });

          if (events.length > 5) {
            events.length = 5;
          }
          cursor.setDate(cursor.getDate() + 1);
        }

        events.forEach(function (eventItem) {
          const item = document.createElement("li");
          item.textContent =
            eventItem.label +
            " - " +
            eventItem.date.toLocaleDateString(undefined, {
              weekday: "short",
              month: "short",
              day: "numeric",
            });
          item.addEventListener("click", function () {
            if (eventItem.label === "Class" && eventItem.dateValue) {
              window.location.href = buildClassDetailsUrl(eventItem.dateValue);
              return;
            }
            openEventInfoModal({
              name: eventItem.label,
              readableDate: formatReadableDate(eventItem.date),
              startText: eventItem.startText || "",
              endText: eventItem.endText || "",
              description: eventItem.description || "",
              deletable: eventItem.deletable,
              dateKey: eventItem.dateValue,
              eventId: eventItem.eventId,
            });
          });
          upcomingTasksList.appendChild(item);
        });
      }

          closeEventInfoModal();
        }
      });
      deleteConfirmBackdrop.addEventListener("click", function (event) {
        if (event.target === deleteConfirmBackdrop) {
          closeDeleteConfirmModal();
        }
      });

      eventForm.addEventListener("submit", function (event) {
        event.preventDefault();
        if (!selectedEventDate) {
          closeEventModal();
          return;
        }

        const eventName = eventNameInput.value.trim();
        if (!eventName) {
          return;
        }

        syncEndTimeIfNeeded();
        const startText = formatDisplayTime(
          startHourSelect.value,
          startMinuteSelect.value,
          startMeridiemSelect.value
        );
        const endText = formatDisplayTime(
          endHourSelect.value,
          endMinuteSelect.value,
          endMeridiemSelect.value
        );
        const startMinutes = to12HourMinutes(
          startHourSelect.value,
          startMinuteSelect.value,
          startMeridiemSelect.value
        );

        const existing = userEventsByDate.get(selectedEventDate) || [];
        existing.push({
          id: String(Date.now()) + Math.random().toString(16).slice(2),
          name: eventName,
          description: eventDescriptionInput.value.trim(),
          startText: startText,
          endText: endText,
          startMinutes: startMinutes,
        });
        existing.sort(function (a, b) {
          return a.startMinutes - b.startMinutes;
        });
        userEventsByDate.set(selectedEventDate, existing);
        saveUserEvents();

        renderCalendar(currentYear, currentMonth);
        closeEventModal();
      });

      deleteEventButton.addEventListener("click", function () {
        if (!currentInfoEventRef) {
          alert("This event cannot be deleted.");
          return;
        }
        deleteConfirmBackdrop.classList.add("open");
      });

      cancelDeleteEventButton.addEventListener("click", closeDeleteConfirmModal);
      confirmDeleteEventButton.addEventListener("click", function () {
        if (!currentInfoEventRef) {
          closeDeleteConfirmModal();
          return;
        }
        const events = userEventsByDate.get(currentInfoEventRef.dateKey) || [];
        const filtered = events.filter(function (eventItem) {
          return eventItem.id !== currentInfoEventRef.eventId;
        });
        if (filtered.length) {
          userEventsByDate.set(currentInfoEventRef.dateKey, filtered);
        } else {
          userEventsByDate.delete(currentInfoEventRef.dateKey);
        }
        saveUserEvents();
        renderCalendar(currentYear, currentMonth);
        closeDeleteConfirmModal();
        closeEventInfoModal();
      });

      startHourSelect.addEventListener("change", syncEndTimeIfNeeded);
      startMinuteSelect.addEventListener("change", syncEndTimeIfNeeded);
      startMeridiemSelect.addEventListener("change", syncEndTimeIfNeeded);
      endHourSelect.addEventListener("change", syncEndTimeIfNeeded);
      endMinuteSelect.addEventListener("change", syncEndTimeIfNeeded);
      endMeridiemSelect.addEventListener("change", syncEndTimeIfNeeded);

      profileButton.addEventListener("click", function (event) {
        event.stopPropagation();
        profileMenu.classList.toggle("open");
      });

      document.addEventListener("click", function (event) {
        if (!profileMenu.contains(event.target) && event.target !== profileButton) {
          profileMenu.classList.remove("open");
        }
      });

      logoutLink.addEventListener("click", function () {
        sessionStorage.removeItem("snapkids_admin_authenticated");
      });

      loadUserEvents();
      buildSeasonOptions();
      if (
        Number.isInteger(requestedYear) &&
        Number.isInteger(requestedMonth) &&
        requestedMonth >= 0 &&
        requestedMonth <= 11 &&
        !isBeforeMinBound(requestedYear, requestedMonth) &&
        !isAfterMaxBound(requestedYear, requestedMonth)
      ) {
        currentYear = requestedYear;
        currentMonth = requestedMonth;
      }
      populateTimeSelects();
      renderCalendar(currentYear, currentMonth);
      if (initialView === "volunteers" || initialView === "students" || initialView === "forms") {
        setActiveView(initialView);
      } else {
        setActiveView("calendar");
      }
    </script>
  </body>
</html>
