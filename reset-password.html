<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password</title>
    <script>
      (function () {
        if (sessionStorage.getItem("snapkids_admin_authenticated") !== "true") {
          window.location.replace("admin-login.html");
        }
      })();
    </script>
    <style>
      :root {
        --foam: #dff8ff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Trebuchet MS", "Segoe UI", sans-serif;
        background: #0f6f9c;
        color: #ffffff;
      }

      .top-bar {
        height: 110px;
        padding: 0.7rem 1rem;
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: rgba(7, 42, 71, 0.55);
        box-shadow: 0 8px 24px rgba(0, 24, 44, 0.35);
      }

      .top-logo {
        width: min(34vw, 240px);
        height: auto;
        transform: translateY(-20px);
      }

      .logo-home-link {
        display: inline-flex;
        align-items: center;
      }

      .back-link {
        border: 0;
        border-radius: 10px;
        padding: 0.6rem 0.85rem;
        font-size: 0.95rem;
        font-weight: 700;
        text-decoration: none;
        color: #06273f;
        background: #dff8ff;
      }

      .page {
        min-height: calc(100vh - 110px);
        display: grid;
        place-items: center;
        padding: 1rem;
      }

      .card {
        width: min(92vw, 500px);
        border-radius: 18px;
        padding: 1rem;
        background: rgba(7, 42, 71, 0.35);
        box-shadow:
          0 18px 40px rgba(0, 24, 44, 0.35),
          inset 0 0 0 1px rgba(223, 248, 255, 0.2);
      }

      h1 {
        margin: 0 0 0.9rem;
      }

      form {
        display: grid;
        gap: 0.75rem;
      }

      label {
        font-weight: 700;
      }

      input {
        width: 100%;
        border: 2px solid transparent;
        border-radius: 10px;
        padding: 0.7rem 0.8rem;
        font-size: 1rem;
      }

      input.input-error {
        border-color: #ff4d4d;
      }

      .error-message {
        margin: -0.2rem 0 0;
        color: #ff6b6b;
        font-size: 0.86rem;
        font-weight: 700;
        display: none;
      }

      .error-message.visible {
        display: block;
      }

      .success-message {
        margin: -0.2rem 0 0;
        color: #b8ffd1;
        font-size: 0.86rem;
        font-weight: 700;
        display: none;
      }

      .success-message.visible {
        display: block;
      }

      .submit-btn {
        border: 0;
        border-radius: 10px;
        padding: 0.7rem 0.8rem;
        font-size: 0.95rem;
        font-weight: 700;
        color: #06273f;
        background: linear-gradient(180deg, #ffffff, var(--foam));
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <header class="top-bar">
      <a class="logo-home-link" href="success.html?tab=calendar" aria-label="Go to calendar">
        <img class="top-logo" src="snapkids_logo.png" alt="SNAPkids logo" />
      </a>
      <a class="back-link" href="profile-page.html">Back</a>
    </header>
    <main class="page">
      <section class="card">
        <h1>Reset Password</h1>
        <form id="reset-password-form">
          <label for="old-password">Old Password</label>
          <input id="old-password" type="password" required />

          <label for="new-password">New Password</label>
          <input id="new-password" type="password" required />

          <label for="confirm-password">Confirm New Password</label>
          <input id="confirm-password" type="password" required />

          <p class="error-message" id="reset-error"></p>
          <p class="success-message" id="reset-success">Password updated. Use it for future logins.</p>

          <button class="submit-btn" type="submit">Update Password</button>
        </form>
      </section>
    </main>
    <script>
      const passwordStorageKey = "snapkids_admin_password_v1";
      const form = document.getElementById("reset-password-form");
      const oldPasswordInput = document.getElementById("old-password");
      const newPasswordInput = document.getElementById("new-password");
      const confirmPasswordInput = document.getElementById("confirm-password");
      const errorEl = document.getElementById("reset-error");
      const successEl = document.getElementById("reset-success");

      function normalizeCredential(value) {
        return String(value || "").trim();
      }

      function getPasswordFromCookie() {
        const cookieName = passwordStorageKey + "=";
        const cookies = document.cookie.split(";");
        for (let i = 0; i < cookies.length; i += 1) {
          const cookie = cookies[i].trim();
          if (cookie.indexOf(cookieName) === 0) {
            return decodeURIComponent(cookie.slice(cookieName.length));
          }
        }
        return "";
      }

      function setPasswordCookie(value) {
        const oneYearInSeconds = 60 * 60 * 24 * 365;
        document.cookie =
          passwordStorageKey +
          "=" +
          encodeURIComponent(value) +
          "; path=/; max-age=" +
          String(oneYearInSeconds) +
          "; SameSite=Lax";
      }

      function getCurrentPassword() {
        try {
          const saved = localStorage.getItem(passwordStorageKey);
          const normalizedSaved = normalizeCredential(saved);
          if (normalizedSaved.length) {
            return normalizedSaved;
          }
        } catch (error) {
          // Fall back to cookie if localStorage is blocked.
        }
        const cookieSaved = normalizeCredential(getPasswordFromCookie());
        if (cookieSaved.length) {
          try {
            localStorage.setItem(passwordStorageKey, cookieSaved);
          } catch (error) {
            // Ignore if unavailable.
          }
          return cookieSaved;
        }
        return "123456";
      }

      function clearMessages() {
        errorEl.classList.remove("visible");
        successEl.classList.remove("visible");
        oldPasswordInput.classList.remove("input-error");
        newPasswordInput.classList.remove("input-error");
        confirmPasswordInput.classList.remove("input-error");
      }

      oldPasswordInput.addEventListener("input", clearMessages);
      newPasswordInput.addEventListener("input", clearMessages);
      confirmPasswordInput.addEventListener("input", clearMessages);

      form.addEventListener("submit", function (event) {
        event.preventDefault();
        clearMessages();

        const oldPassword = normalizeCredential(oldPasswordInput.value);
        const newPassword = normalizeCredential(newPasswordInput.value);
        const confirmPassword = normalizeCredential(confirmPasswordInput.value);
        const currentPassword = getCurrentPassword();

        if (oldPassword !== currentPassword) {
          oldPasswordInput.classList.add("input-error");
          errorEl.textContent = "Old password is incorrect.";
          errorEl.classList.add("visible");
          return;
        }

        if (!newPassword) {
          newPasswordInput.classList.add("input-error");
          errorEl.textContent = "New password cannot be empty.";
          errorEl.classList.add("visible");
          return;
        }

        if (newPassword !== confirmPassword) {
          newPasswordInput.classList.add("input-error");
          confirmPasswordInput.classList.add("input-error");
          errorEl.textContent = "New passwords do not match.";
          errorEl.classList.add("visible");
          return;
        }

        setPasswordCookie(newPassword);
        try {
          localStorage.setItem(passwordStorageKey, newPassword);
        } catch (error) {
          // Ignore if unavailable.
        }
        successEl.classList.add("visible");
        oldPasswordInput.value = "";
        newPasswordInput.value = "";
        confirmPasswordInput.value = "";
      });
    </script>
  </body>
</html>
