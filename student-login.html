<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Login</title>
    <style>
      :root {
        --foam: #dff8ff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: "Trebuchet MS", "Segoe UI", sans-serif;
        background: #0f6f9c;
      }

      .corner-logo {
        position: fixed;
        top: -36px;
        left: 1rem;
        width: min(34vw, 240px);
        height: auto;
      }

      .card {
        width: min(90vw, 460px);
        padding: 2rem;
        border-radius: 20px;
        background: rgba(7, 42, 71, 0.35);
        backdrop-filter: blur(2px);
        box-shadow:
          0 18px 40px rgba(0, 24, 44, 0.45),
          inset 0 0 0 1px rgba(223, 248, 255, 0.2);
      }

      h1 {
        margin: 0 0 0.35rem;
        font-size: 1.5rem;
        color: white;
      }

      .hint {
        margin: 0 0 1.25rem;
        color: #dff8ff;
        font-size: 0.92rem;
      }

      form {
        display: grid;
        gap: 0.9rem;
      }

      label {
        color: white;
        font-weight: 700;
      }

      input {
        width: 100%;
        border: 2px solid transparent;
        padding: 0.8rem 0.9rem;
        border-radius: 10px;
        font-size: 1rem;
      }

      input.input-error {
        border-color: #ff4d4d;
      }

      .error-message {
        margin: -0.35rem 0 0;
        color: #ff6b6b;
        font-size: 0.85rem;
        font-weight: 700;
        display: none;
      }

      .error-message.visible {
        display: block;
      }

      .actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0.75rem;
        margin-top: 0.4rem;
      }

      .actions button,
      .actions a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        border: 0;
        padding: 0.9rem 1rem;
        border-radius: 12px;
        color: #06273f;
        font-size: 1rem;
        font-weight: 700;
        text-decoration: none;
        background: linear-gradient(180deg, #ffffff, var(--foam));
        cursor: pointer;
      }

      @media (max-width: 860px) {
        .corner-logo {
          width: min(42vw, 180px);
        }
      }
    </style>
  </head>
  <body>
    <img class="corner-logo" src="snapkids_logo.png" alt="SNAPkids logo" />
    <main class="card">
      <h1>Student Sign In</h1>
      <p class="hint">Use your student name and password.</p>
      <form id="student-login-form">
        <label for="student-name">Student Name</label>
        <input id="student-name" name="student-name" type="text" autocomplete="name" required />

        <label for="student-password">Password</label>
        <input
          id="student-password"
          name="student-password"
          type="password"
          required
        />

        <p id="login-error" class="error-message">Name and/or password incorrect</p>

        <div class="actions">
          <button type="submit">Sign In</button>
          <a href="index.html">Back</a>
        </div>
      </form>
    </main>
    <script>
      const form = document.getElementById("student-login-form");
      const nameInput = document.getElementById("student-name");
      const passwordInput = document.getElementById("student-password");
      const errorMessage = document.getElementById("login-error");

      const studentCredentials = new Map([
        ["joe mama", "123456"],
        ["bobby bob", "654321"],
        ["john pork", "000000"],
      ]);

      function clearErrorState() {
        nameInput.classList.remove("input-error");
        passwordInput.classList.remove("input-error");
        errorMessage.classList.remove("visible");
      }

      nameInput.addEventListener("input", clearErrorState);
      passwordInput.addEventListener("input", clearErrorState);

      form.addEventListener("submit", function (event) {
        event.preventDefault();

        const enteredName = nameInput.value.trim();
        const enteredPassword = passwordInput.value.trim();
        const validPassword = studentCredentials.get(enteredName.toLowerCase());

        if (enteredName && validPassword === enteredPassword) {
          sessionStorage.setItem("snapkids_student_authenticated", "true");
          sessionStorage.setItem("snapkids_student_name", enteredName);
          window.location.href = "student-home.html";
          return;
        }

        nameInput.classList.add("input-error");
        passwordInput.classList.add("input-error");
        errorMessage.classList.add("visible");
      });
    </script>
  </body>
</html>
